name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci && npm run build

      - name: Trigger cPanel Git Deploy
        run: |
          RESPONSE=$(curl -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.SSH_HOST }}:2083/execute/VersionControl/update" \
            -d "repository=${{ secrets.CPANEL_REPO_PATH }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":1' || (echo "Deploy failed: $RESPONSE" && exit 1)
