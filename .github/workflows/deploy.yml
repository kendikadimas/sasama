name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci && npm run build

      - name: Commit build assets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f public/build
          git diff --cached --quiet || git commit -m "ci: update build assets [skip ci]"
          git push

      - name: Trigger cPanel Git Deploy
        run: |
          RESPONSE=$(curl -sk \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.SSH_HOST }}:2083/execute/VersionControl/update" \
            -d "repository_root=${{ secrets.CPANEL_REPO_PATH }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":1' || (echo "Deploy failed: $RESPONSE" && exit 1)
